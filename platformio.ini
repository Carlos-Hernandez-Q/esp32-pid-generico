[platformio]
default_envs = esp32

[env:esp32]
platform = platformio/espressif32@6.12.0 ; Version fijada de la plataforma ESP32.
board = esp32dev                       ; ESP32 DevKit clasico; cambiar para otra placa.
framework = arduino                   ; API Arduino dentro del proyecto PlatformIO.
monitor_speed = 115200                 ; Debe coincidir con Config::BAUDIOS.
build_src_filter = +<*> -<ejemplos/>   ; Firmware de la plantilla general.
build_flags =
    -Wall                             ; Habilita advertencias del compilador.
    -Wextra                           ; Habilita advertencias adicionales.

[env:ldr_led]
extends = env:esp32
build_src_filter = -<*> +<ejemplos/ldr_led.cpp> ; Firmware de la práctica LDR + LED.
